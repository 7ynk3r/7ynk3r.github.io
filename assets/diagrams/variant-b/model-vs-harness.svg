<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variant-b-model-vs-harness-title variant-b-model-vs-harness-desc" id="model-vs-harness-root">
<title id="variant-b-model-vs-harness-title">The model is the engine, the harness is the car</title><desc id="variant-b-model-vs-harness-desc">Four stacked layers: the model as engine at the bottom, then context, tools and memory as the steering wheel, rules and checks as brakes, and eval loops as the dashboard.</desc>
<defs>
      <style>#model-vs-harness-root { --color-paper:#ffffff;--color-ink:#333333;--color-muted:#666666;--color-accent:#0062cc }
      #model-vs-harness-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif; color: var(--color-ink); }
      #model-vs-harness-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#model-vs-harness-root .diagram-container { overflow-x:visible }
}</style><marker id="model-vs-harness-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
<marker id="model-vs-harness-aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0062cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="144" y="40" width="792" height="72" fill="#ffffff"/><rect x="144" y="40" width="792" height="72" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="540.0" y="74.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Eval loops</text><text x="540.0" y="92.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">did it pass, is it drifting</text><text x="128" y="80" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">DASHBOARD</text><rect x="144" y="128" width="792" height="72" fill="#ffffff"/><rect x="144" y="128" width="792" height="72" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="540.0" y="162.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Rules and checks</text><text x="540.0" y="180.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">schema, permissions, stop conditions</text><text x="128" y="168" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">BRAKES</text><rect x="144" y="216" width="792" height="72" fill="#ffffff"/><rect x="144" y="216" width="792" height="72" rx="6" fill="#0062cc" stroke="#0062cc" stroke-width="1.5" fill-opacity="0.07"/><text x="540.0" y="250.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Context, tools, memory</text><text x="540.0" y="268.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">what it sees, what it can call, what it keeps</text><text x="128" y="256" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#0062cc">STEERING WHEEL</text><rect x="144" y="304" width="792" height="72" fill="#ffffff"/><rect x="144" y="304" width="792" height="72" rx="6" fill="#f8f9fa" stroke="#666666" stroke-width="1"/><text x="540.0" y="338.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">The model</text><text x="540.0" y="356.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">raw capability, swappable</text><text x="128" y="344" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">ENGINE</text><text x="144" y="30" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">HARNESS: WHERE JUDGMENT LIVES</text><line x1="24" y1="400" x2="936" y2="400" stroke="#333333" stroke-opacity="0.14"/><rect x="24" y="407" width="12" height="12" rx="2" fill="#0062cc" stroke="#0062cc" fill-opacity="0.07"/><text x="52" y="417" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">steering: the layer that matters most</text><rect x="328.2" y="407" width="12" height="12" rx="2" fill="#ffffff" stroke="#333333"/><text x="356.2" y="417" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">harness layer</text>
</svg>
