<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variant-b-whiteboard-title variant-b-whiteboard-desc" id="whiteboard-root">
<title id="variant-b-whiteboard-title">The spec is a shared whiteboard</title><desc id="variant-b-whiteboard-desc">A shared whiteboard between me and the model holding goal, constraints, examples, and a done-when line; I write to it, the model reads it and asks questions back.</desc>
<defs>
      <style>#whiteboard-root { --color-paper:#ffffff;--color-ink:#333333;--color-muted:#666666;--color-accent:#0062cc }
      #whiteboard-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif; color: var(--color-ink); }
      #whiteboard-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#whiteboard-root .diagram-container { overflow-x:visible }
}</style><marker id="whiteboard-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
<marker id="whiteboard-aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0062cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
