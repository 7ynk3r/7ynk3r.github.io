e-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Prompt</text><text x="480.0" y="96.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">first attempt</text><rect x="720" y="180" width="200" height="72" fill="#ffffff"/><rect x="720" y="180" width="200" height="72" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><rect x="730" y="190" width="19" height="16" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/><text x="736" y="201.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#666666">2</text><text x="820.0" y="218.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Bad output</text><text x="820.0" y="236.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">free requirements</text><rect x="380" y="320" width="200" height="72" fill="#ffffff"/><rect x="380" y="320" width="200" height="72" rx="6" fill="#0062cc" stroke="#0062cc" stroke-width="1.5" fill-opacity="0.07"/><rect x="390" y="330" width="19" height="16" rx="2" fill="none" stroke="#0062cc" stroke-width="0.8"/><text x="396" y="341.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#0062cc">3</text><text x="480.0" y="358.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Frustration</text><text x="480.0" y="376.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">the signal</text><rect x="40" y="180" width="200" height="72" fill="#ffffff"/><rect x="40" y="180" width="200" height="72" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><rect x="50" y="190" width="19" height="16" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/><text x="56" y="201.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#666666">4</text><text x="140.0" y="218.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Refined spec</text><text x="140.0" y="236.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">what I meant</text><rect x="380" y="180" width="200" height="72" fill="#ffffff"/><rect x="380" y="180" width="200" height="72" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/><text x="480.0" y="214.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Better output</text><text x="480.0" y="232.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">each lap</text><line x1="24" y1="420" x2="936" y2="420" stroke="#333333" stroke-opacity="0.14"/><rect x="24" y="427" width="12" height="12" rx="2" fill="#0062cc" stroke="#0062cc" fill-opacity="0.07"/><text x="52" y="437" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">the moment to stop and name it</text><line x1="282.0" y1="433" x2="302.0" y2="433" stroke="#666666"/><text x="310.0" y="437" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">one lap of the conversation</text>
</svg>
