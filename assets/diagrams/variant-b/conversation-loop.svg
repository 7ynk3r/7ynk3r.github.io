<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variant-b-conversation-loop-title variant-b-conversation-loop-desc" id="conversation-loop-root">
<title id="variant-b-conversation-loop-title">The feedback loop is a conversation</title><desc id="variant-b-conversation-loop-desc">A loop from prompt to bad output to frustration to a refined spec and back to the prompt, with better output accumulating in the middle on each lap.</desc>
<defs>
      <style>#conversation-loop-root { --color-paper:#ffffff;--color-ink:#333333;--color-muted:#666666;--color-accent:#0062cc }
      #conversation-loop-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif; color: var(--color-ink); }
      #conversation-loop-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#conversation-loop-root .diagram-container { overflow-x:visible }
}</style><marker id="conversation-loop-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
<marker id="conversation-loop-aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0062cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
