<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variant-c-harness-artifact-title variant-c-harness-artifact-desc" id="harness-artifact-root">
<title id="variant-c-harness-artifact-title">The harness is the real artifact</title><desc id="variant-c-harness-artifact-desc">A two by two of model capability against harness tightness: a cheap model in a tight harness lands in the best quadrant for repeat work, while a frontier model with no harness is brilliant but unrepeatable.</desc>
<defs>
      <style>#harness-artifact-root { --color-paper:#ffffff;--color-ink:#333333;--color-muted:#666666;--color-accent:#0062cc }
      #harness-artifact-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif; color: var(--color-ink); }
      #harness-artifact-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#harness-artifact-root .diagram-container { overflow-x:visible }
}</style><marker id="harness-artifact-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
<marker id="harness-artifact-aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0062cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="120" y1="380" x2="900" y2="380" stroke="#333333"/><line x1="120" y1="40" x2="120" y2="380" stroke="#333333"/><line x1="510" y1="40" x2="510" y2="380" stroke="#333333" stroke-dasharray="4,3" stroke-opacity="0.14"/><line x1="120" y1="210" x2="900" y2="210" stroke="#333333" stroke-dasharray="4,3" stroke-opacity="0.14"/><text x="510" y="404" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">MODEL CAPABILITY AND COST  →</text><text x="108" y="44" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">TIGHT</text><text x="108" y="380" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">NONE</text><text x="108" y="212" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">HARNESS</text><rect x="160" y="80" width="300" height="88" fill="#ffffff"/><rect x="160" y="80" width="300" height="88" rx="6" fill="#0062cc" stroke="#0062cc" stroke-width="1.5" fill-opacity="0.07"/><rect x="170" y="90" width="144" height="16" rx="2" fill="none" stroke="#0062cc" stroke-width="0.8"/><text x="176" y="101.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#0062cc">BEST FOR REPEAT WORK</text><text x="310.0" y="126.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Cheap model, tight harness</text><text x="310.0" y="144.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">predictable, fast, cheap</text><rect x="560" y="80" width="300" height="88" fill="#ffffff"/><rect x="560" y="80" width="300" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="710.0" y="122.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Frontier model, tight harness</text><text x="710.0" y="140.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">reliable, paying for brains</text><rect x="160" y="252" width="300" height="88" fill="#ffffff"/><rect x="160" y="252" width="300" height="88" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/><text x="310.0" y="294.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Cheap model, no harness</text><text x="310.0" y="312.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">vending machine</text><rect x="560" y="252" width="300" height="88" fill="#ffffff"/><rect x="560" y="252" width="300" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="710.0" y="294.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Frontier model, no harness</text><text x="710.0" y="312.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">brilliant, unrepeatable</text><line x1="24" y1="428" x2="936" y2="428" stroke="#333333" stroke-opacity="0.14"/><rect x="24" y="435" width="12" height="12" rx="2" fill="#0062cc" stroke="#0062cc" fill-opacity="0.07"/><text x="52" y="445" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">where the harness absorbs the missing intelligence</text>
</svg>
