<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variant-a-assembly-line-title variant-a-assembly-line-desc" id="assembly-line-root">
<title id="variant-a-assembly-line-title">An assembly line of prompts</title><desc id="variant-a-assembly-line-desc">A spec moves through a draft station, a shaping station, and an inspection station; rejected output loops back and becomes a new line in the spec.</desc>
<defs>
      <style>#assembly-line-root { --color-paper:#ffffff;--color-ink:#333333;--color-muted:#666666;--color-accent:#0062cc }
      #assembly-line-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif; color: var(--color-ink); }
      #assembly-line-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#assembly-line-root .diagram-container { overflow-x:visible }
}</style><marker id="assembly-line-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
<marker id="assembly-line-aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0062cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<path d="M184 140 H220" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#assembly-line-a)"/><path d="M384 140 H420" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#assembly-line-a)"/><path d="M584 140 H620" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#assembly-line-a)"/><path d="M784 140 H820" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#assembly-line-a)"/><path d="M704 184 V252 Q704 260 696 260 H112 Q104 260 104 252 V188" fill="none" stroke="#0062cc" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#assembly-line-aa)"/><rect x="316" y="237" width="176" height="15" fill="#ffffff"/><text x="404" y="248" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="0.06em" fill="#0062cc">REJECT = NEW REQUIREMENT</text><rect x="24" y="96" width="160" height="88" fill="#ffffff"/><rect x="24" y="96" width="160" height="88" rx="6" fill="#f8f9fa" stroke="#666666" stroke-width="1"/><rect x="34" y="106" width="45" height="16" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/><text x="40" y="117.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#666666">INPUT</text><text x="104.0" y="142.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Spec</text><text x="104.0" y="160.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">goal, format, done-when</text><rect x="224" y="96" width="160" height="88" fill="#ffffff"/><rect x="224" y="96" width="160" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><rect x="234" y="106" width="71" height="16" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/><text x="240" y="117.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#666666">STATION 1</text><text x="304.0" y="142.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Draft</text><text x="304.0" y="160.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">cheap model, one job</text><rect x="424" y="96" width="160" height="88" fill="#ffffff"/><rect x="424" y="96" width="160" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><rect x="434" y="106" width="71" height="16" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/><text x="440" y="117.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#666666">STATION 2</text><text x="504.0" y="142.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Shape</text><text x="504.0" y="160.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">schema, template</text><rect x="624" y="96" width="160" height="88" fill="#ffffff"/><rect x="624" y="96" width="160" height="88" rx="6" fill="#0062cc" stroke="#0062cc" stroke-width="1.5" fill-opacity="0.07"/><rect x="634" y="106" width="58" height="16" rx="2" fill="none" stroke="#0062cc" stroke-width="0.8"/><text x="640" y="117.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#0062cc">INSPECT</text><text x="704.0" y="142.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Check</text><text x="704.0" y="160.0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#6b6b6b">evals, rules, diff</text><rect x="824" y="96" width="112" height="88" fill="#ffffff"/><rect x="824" y="96" width="112" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1"/><rect x="834" y="106" width="52" height="16" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/><text x="840" y="117.5" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.08em" fill="#666666">OUTPUT</text><text x="880.0" y="148.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="600" font-size="14" fill="#333333">Ship</text><text x="24" y="60" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="italic" fill="#6b6b6b">Each station does one thing. Inspection decides what goes back upstream.</text><line x1="24" y1="304" x2="936" y2="304" stroke="#333333" stroke-opacity="0.14"/><rect x="24" y="311" width="12" height="12" rx="2" fill="#ffffff" stroke="#333333"/><text x="52" y="321" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">station</text><rect x="130.2" y="311" width="12" height="12" rx="2" fill="#0062cc" stroke="#0062cc" fill-opacity="0.07"/><text x="158.2" y="321" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">inspection</text><line x1="256.2" y1="317" x2="276.2" y2="317" stroke="#666666" stroke-dasharray="5,4"/><text x="284.2" y="321" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6b6b6b">rework loop feeds the spec</text>
</svg>
