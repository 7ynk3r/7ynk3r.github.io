<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variant-a-jig-title variant-a-jig-desc" id="jig-root">
<title id="variant-a-jig-title">The jig does the precision work</title><desc id="variant-a-jig-desc">An artisan setup where a frontier model decides the format each time produces varied parts, while a cheap model held inside a jig of schema, examples, checks, and a retry rule produces the same part every time.</desc>
<defs>
      <style>#jig-root { --color-paper:#ffffff;--color-ink:#333333;--color-muted:#666666;--color-accent:#0062cc }
      #jig-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif; color: var(--color-ink); }
      #jig-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#jig-root .diagram-container { overflow-x:visible }
}</style><marker id="jig-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
<marker id="jig-aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0062cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
